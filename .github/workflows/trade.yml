name: Autonomous Trader

on:
  schedule:
    - cron: '0 21 * * 1-5'    # 4:00pm ET — close phase: score & queue orders
    - cron: '35 13 * * 2-6'   # 9:35am ET — open phase: fill orders at market open
  workflow_dispatch:
    inputs:
      phase:
        description: 'Which phase to run'
        required: false
        default: 'close'
        type: choice
        options:
          - close
          - open

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas numpy

      - name: Configure git
        run: |
          git config user.name "Autonomous Trader"
          git config user.email "bot@autonomous-trader"

      - name: Pull latest
        run: git pull --rebase -X theirs origin main || true

      - name: Determine phase
        id: phase
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "phase=${{ github.event.inputs.phase }}" >> $GITHUB_OUTPUT
          elif [ "$(date -u +%H)" = "13" ]; then
            echo "phase=open" >> $GITHUB_OUTPUT
          else
            echo "phase=close" >> $GITHUB_OUTPUT
          fi

      - name: Run trader
        run: python trader.py ${{ steps.phase.outputs.phase }}

      - name: Commit results
        run: |
          for f in state.json index.html; do
            [ -f "$f" ] && git add -f "$f"
          done
          find reports -name 'autonomous_*.html' 2>/dev/null | xargs -r git add -f
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "trade[${{ steps.phase.outputs.phase }}]: $(date -u '+%Y-%m-%d %H:%M') [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && break
            sleep 5
          done
